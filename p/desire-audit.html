<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Prompt Ready to Copy</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@600;700&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Montserrat', sans-serif;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .container {
            max-width: 500px;
            width: 100%;
            background: white;
            padding: 50px 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.1);
            text-align: center;
        }
        .icon { font-size: 64px; margin-bottom: 20px; transition: all 0.3s ease; }
        .icon.success { color: #D4AF37; }
        .icon.pending { color: #0F4C81; }
        h1 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 32px;
            color: #2C3E50;
            margin-bottom: 15px;
            font-weight: 700;
        }
        .message { color: #666; font-size: 16px; line-height: 1.6; margin-bottom: 30px; }
        .copy-button {
            background: #D4AF37;
            color: white;
            border: none;
            padding: 16px 40px;
            font-size: 16px;
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.3s ease;
            font-family: 'Montserrat', sans-serif;
            letter-spacing: 0.5px;
        }
        .copy-button:hover {
            background: #c49d2e;
            transform: translateY(-2px);
            box-shadow: 0 4px 12px rgba(212, 175, 55, 0.3);
        }
        .copy-button:active { transform: translateY(0); }
        .copy-button.copied { background: #27ae60; }
        .toggle-btn {
            background: none;
            border: none;
            color: #0F4C81;
            font-family: 'Montserrat', sans-serif;
            font-size: 13px;
            cursor: pointer;
            margin-top: 24px;
            display: block;
            width: 100%;
            text-align: center;
            opacity: 0.6;
            transition: opacity 0.2s;
        }
        .toggle-btn:hover { opacity: 1; }
        .prompt-box {
            display: none;
            margin-top: 16px;
            text-align: left;
            background: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
        }
        .prompt-box.visible { display: block; }
        .prompt-text {
            font-size: 11px;
            color: #555;
            line-height: 1.8;
            white-space: pre-wrap;
            font-family: 'Montserrat', sans-serif;
            user-select: all;
        }
        .footer {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #eee;
            color: #999;
            font-size: 13px;
        }
        .brand { color: #D4AF37; font-weight: 600; }
        .loading {
            display: inline-block;
            width: 20px;
            height: 20px;
            border: 3px solid #f3f3f3;
            border-top: 3px solid #D4AF37;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-right: 10px;
            vertical-align: middle;
        }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        .hidden { display: none; }
    </style>
</head>
<body>
    <div class="container">
        <div id="icon" class="icon pending">📋</div>
        <h1 id="title">Preparing Your Prompt...</h1>
        <p id="message" class="message">
            <span class="loading"></span>
            Attempting to copy automatically...
        </p>
        <button id="copyButton" class="copy-button hidden">Tap to Copy</button>
        <button class="toggle-btn" onclick="togglePrompt()">
            <span id="toggleLabel">Show prompt ↓</span>
        </button>
        <div id="promptBox" class="prompt-box">
            <pre id="promptDisplay" class="prompt-text"></pre>
        </div>
        <div class="footer">
            <span class="brand">Diamond Self</span> • The Desire Audit
        </div>
    </div>

    <script>
        const promptText = `"I just completed The Desire Audit for this desire: [YOUR DESIRE]

Here are my results from the three filters:

1. Justification Check: [Write: Do I need to explain why? Yes/No + thoughts]

2. Energy Direction: [Write: Does this drain or energize me? + thoughts]

3. Audience Test: [Write: Would I want this if no one knew? Yes/No + thoughts]

Based on these results, I concluded: [Write your conclusion]

Now gently reflect back what I might be missing:

⯁ What patterns do you notice in my responses?
⯁ Where might I be in my own way without realizing it?
⯁ What could be driving this desire that I haven't acknowledged?
⯁ Does this feel more like a Diamond Core desire (authentic, energizing) or Surface Polish (performative, draining)?
⯁ What truth might I be avoiding about this desire?
⯁ What would someone who deeply cares about me notice?"`;

        const icon = document.getElementById('icon');
        const title = document.getElementById('title');
        const message = document.getElementById('message');
        const copyButton = document.getElementById('copyButton');
        document.getElementById('promptDisplay').textContent = promptText;

        async function tryAutoCopy() {
            try {
                await navigator.clipboard.writeText(promptText);
                showSuccess();
            } catch (err) {
                showManualCopy();
            }
        }

        function showSuccess() {
            icon.textContent = '✓';
            icon.className = 'icon success';
            title.textContent = 'Prompt Copied!';
            message.innerHTML = 'The prompt is now in your clipboard.<br>Paste it into ChatGPT or Claude to continue.';
            copyButton.classList.add('hidden');
        }

        function showManualCopy() {
            icon.textContent = '📋';
            icon.className = 'icon pending';
            title.textContent = 'One More Step';
            message.textContent = 'Tap the button below to copy the prompt to your clipboard.';
            copyButton.classList.remove('hidden');
        }

        copyButton.addEventListener('click', async () => {
            try {
                await navigator.clipboard.writeText(promptText);
                copyButton.textContent = '✓ Copied!';
                copyButton.className = 'copy-button copied';
                setTimeout(() => { showSuccess(); }, 500);
            } catch (err) {
                copyButton.textContent = 'Select & copy manually ↓';
                const box = document.getElementById('promptBox');
                const label = document.getElementById('toggleLabel');
                box.classList.add('visible');
                label.textContent = 'Hide prompt ↑';
                setTimeout(() => {
                    document.getElementById('promptDisplay').focus();
                }, 100);
            }
        });

        function togglePrompt() {
            const box = document.getElementById('promptBox');
            const label = document.getElementById('toggleLabel');
            box.classList.toggle('visible');
            label.textContent = box.classList.contains('visible') ? 'Hide prompt ↑' : 'Show prompt ↓';
        }

        setTimeout(tryAutoCopy, 100);
    </script>
</body>
</html>
